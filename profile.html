<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Roblox Creator Hub</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<div class="logo">
🎮 Roblox Creator Hub
</div>

<nav>

<a href="index.html">Home</a>

<a href="gallery.html">Gallery</a>

<a href="profile.html">Profile</a>

</nav>

</header>



<section class="profile-container">


<div class="profile-card">


<img id="avatar"
src="assets/images/default.png"
class="avatar">


<h1 id="username">
Loading...
</h1>


<p id="bio">
Loading bio...
</p>



<button id="editBtn">

✏️ Edit Profile

</button>



<button 
id="adminBtn"
style="display:none;">

⚙️ Admin Panel

</button>



</div>





<div class="uploads-section">


<h2>
🖼 My Uploads
</h2>


<div 
id="uploads"
class="card-grid">


<p>
No uploads yet.
</p>


</div>


</div>



</section>





<style>


.profile-container{

max-width:1000px;

margin:50px auto;

padding:20px;

}



.profile-card{

background:#171b24;

padding:30px;

border-radius:20px;

text-align:center;

border:1px solid rgba(255,255,255,.1);

box-shadow:0 0 25px rgba(123,92,255,.2);

}



.avatar{

width:140px;

height:140px;

border-radius:50%;

object-fit:cover;

border:4px solid #6ab7ff;

}



.profile-card h1{

margin-top:20px;

}



.profile-card p{

color:#aaa;

margin:15px;

}



button{

padding:12px 25px;

border:none;

border-radius:10px;

margin:8px;

cursor:pointer;

background:linear-gradient(
90deg,
#4cc9ff,
#7b5cff
);

color:white;

font-size:16px;

}



.uploads-section{

margin-top:40px;

background:#171b24;

padding:25px;

border-radius:20px;

}



.upload-card{

background:#242938;

padding:15px;

border-radius:15px;

}



.upload-card img{

width:100%;

border-radius:10px;

}


</style>





<script type="module">


import { auth, db } from "./js/firebase.js";


import {

onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

doc,

getDoc

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="login.html";

return;

}



const userDoc = await getDoc(

doc(db,"users",user.uid)

);



if(userDoc.exists()){


const data = userDoc.data();



document.getElementById("username").innerHTML =
data.username;



document.getElementById("bio").innerHTML =
data.bio;



document.getElementById("avatar").src =
data.avatar;



// OWNER ADMIN BUTTON

if(data.username === "TheRealAlteo1"){


document.getElementById("adminBtn").style.display="inline-block";


}



}



});




// Edit Profile button


document.getElementById("editBtn").onclick=()=>{


alert(
"Profile editor coming soon!"
);


};



// Admin button


document.getElementById("adminBtn").onclick=()=>{


window.location.href="admin.html";


};



</script>


</body>

</html>
